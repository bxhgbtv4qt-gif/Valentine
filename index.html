<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For You 🩶</title>
  <style>
    body {
      background: #f2f2f2;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 100px;
    }
    h1 {
      font-size: 2.8em;
      color: #444;
    }
    button {
      font-size: 1.4em;
      padding: 15px 30px;
      margin: 20px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
    }
    #yes {
      background: #555;
      color: white;
    }
    #no {
      background: #d9d9d9;
      position: absolute;
    }
    p {
      font-size: 1.5em;
      color: #555;
    }
  </style>
</head>

<body>
  <h1>Will you be my Valentine baby? 😋🩶</h1>

  <button id="yes" onclick="yesClick()">YES YOU BETTER BE MINE MWHAHAHA</button>
  <button id="no" onclick="moveNo()">po u hate me🙁</button>

  <script>
    function yesClick() {
      document.body.innerHTML = `
        <h1>YAYY I LOVE YOU SOO MUCHH EHEHEH 🩶🫶</h1>
        <p>You’re stuck with me now </p>
      `;
    }

    function moveNo() {
      const x = Math.random() * (window.innerWidth - 150);
      const y = Math.random() * (window.innerHeight - 150);
      const noBtn = document.getElementById("no");
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }
  </script>
</body>
</html>
