<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Valentine 💗</title>

  <!-- Cute fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500&display=swap" rel="stylesheet">

  <style>
    body {
      background: #fff0f5;
      text-align: center;
      padding-top: 120px;
      font-family: 'Quicksand', sans-serif;
      overflow: hidden;
    }

    h1 {
      font-family: 'Pacifico', cursive;
      font-size: 3em;
      color: #ff6f91;
      margin-bottom: 40px;
    }

    button {
      font-size: 1.4em;
      padding: 15px 35px;
      margin: 15px;
      border: none;
      border-radius: 40px;
      cursor: pointer;
    }

    #yes {
      background: #ff6f91;
      color: white;
    }

    #no {
      background: #ffd6e5;
      color: #ff6f91;
      position: absolute;
    }

    /* 💕 Floating hearts */
    .heart {
      position: fixed;
      bottom: -10px;
      font-size: 24px;
      animation: floatUp 6s linear infinite;
      opacity: 0.7;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0);
        opacity: 0.7;
      }
      100% {
        transform: translateY(-100vh);
        opacity: 0;
      }
    }

    .photos img {
      width: 200px;
      border-radius: 20px;
      margin: 10px;
    }
  </style>
</head>

<body>

  <h1>Will you be my Valentine baby? 💗</h1>

  <button id="yes" onclick="yesClick()">YESSSS</button>
  <button id="no" onclick="noClick()">no ew</button>

  <script>
    let noClicks = 0;

    function yesClick() {
      document.body.innerHTML = `
        <h1>omg i knew it YES YOU BETTER BE MINE HEHEHHE I LOVE YOU THE MOSTEST 💗🫶</h1>
        <div class="photos">
          <img src="photo1.jpg">
          <img src="photo2.jpg">
        </div>
      `;
    }

    function noClick() {
      noClicks++;

      if (noClicks === 1) {
        const x = Math.random() * (window.innerWidth - 150);
        const y = Math.random() * (window.innerHeight - 150);
        const noBtn = document.getElementById("no");
        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";
      } else {
        document.body.innerHTML = `
          <h1>u hate me and want me to die poooo </h1>
        `;
      }
    }

    // 💗 Generate pink hearts
    const hearts = ["💗", "💖", "💕"];

    setInterval(() => {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerText = hearts[Math.floor(Math.random() * hearts.length)];
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = Math.random() * 20 + 15 + "px";
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 6000);
    }, 400);
  </script>

</body>
</html>
